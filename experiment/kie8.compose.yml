# Experimental 8-NF signed KIE observer plane. Agents report their OWN receipt counters;
# Open5GS NFs are not modified and these are NOT native 3GPP attestations.
services:
  kie8-nrf:
    image: python:3.11-slim
    container_name: kie8-nrf
    network_mode: "service:nrf"
    depends_on:
      nrf:
        condition: service_started
    environment:
      KIE_NODE: nrf
      KIE_NF_IP: 10.45.0.11
      KIE_TEST_KEY: ${KIE_TEST_KEY:?Generate a fresh 256-bit test-only HMAC key}
    volumes:
      - ${KIE_SOURCE_DIR:?Absolute repository root}/experiment/kie_agent.py:/app/agent.py:ro
    entrypoint: ["python", "-u", "/app/agent.py"]

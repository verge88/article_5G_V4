name: Live 5G SA signaling experiment

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke=fast CI; research=longer acquisition"
        required: true
        type: choice
        options: [smoke, research]
        default: smoke

permissions:
  contents: read

concurrency:
  group: 5g-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Causal feature and analysis tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests (fixtures never become experimental evidence)
        run: python -m pytest -q tests
      - name: Compile/check scripts
        run: |
          python -m compileall -q experiment
          bash -n scripts/run_live.sh

  live-core:
    name: Open5GS + UERANSIM / NF faults / adaptive ML
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPERIMENT_MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect host capabilities
        run: |
          uname -a
          docker info --format '{{.ServerVersion}}'
          docker compose version
          curl -V
          ls -l /dev/net/tun || true
          lsmod | grep -E '^sctp|^tun' || true
      - name: Install CPU-only PyTorch for genuine trainable graph-temporal model
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
      - name: Run REAL 5GC experiment (fail closed)
        run: bash scripts/run_live.sh
      - name: Publish raw measurements, faults, model metrics, and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 5g-live-evidence-${{ github.run_id }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
